name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project and copy your files in
        run: |
          flutter create --org com.myreminder --project-name reminder_app app
          cp main.dart app/lib/main.dart
          cp pubspec.yaml app/pubspec.yaml

      - name: Patch Android settings
        run: |
          python3 - <<'PY'
          import pathlib, re

          # 1) Manifest: permissions + notification receivers
          m = pathlib.Path('app/android/app/src/main/AndroidManifest.xml')
          s = m.read_text()
          perms = '''<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32"/>
              '''
          receivers = '''<receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />
              <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                  <intent-filter>
                      <action android:name="android.intent.action.BOOT_COMPLETED"/>
                      <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                      <action android:name="android.intent.action.QUICKBOOT_POWERON"/>
                      <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>
                  </intent-filter>
              </receiver>
              <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ActionBroadcastReceiver" />
              '''
          s = s.replace('<application', perms + '<application', 1)
          s = s.replace('</application>', receivers + '</application>', 1)
          m.write_text(s)

          # 2) Gradle: core library desugaring
          kts = pathlib.Path('app/android/app/build.gradle.kts')
          groovy = pathlib.Path('app/android/app/build.gradle')
          if kts.exists():
              t = kts.read_text()
              t = re.sub(
                  r'compileOptions\s*\{[^}]*\}',
                  'compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n'
                  '        sourceCompatibility = JavaVersion.VERSION_17\n'
                  '        targetCompatibility = JavaVersion.VERSION_17\n    }',
                  t, count=1)
              t += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
              kts.write_text(t)
          else:
              t = groovy.read_text()
              t = re.sub(
                  r'compileOptions\s*\{[^}]*\}',
                  'compileOptions {\n        coreLibraryDesugaringEnabled true\n'
                  '        sourceCompatibility JavaVersion.VERSION_17\n'
                  '        targetCompatibility JavaVersion.VERSION_17\n    }',
                  t, count=1)
              t += "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n"
              groovy.write_text(t)
          PY

      - name: Build APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: app/build/app/outputs/flutter-apk/app-release.apk
